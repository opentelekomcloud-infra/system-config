{{- /*
GitOps-managed OpenStack credentials for the SysEleven Designate webhook.

The webhook Deployment does `envFrom: secretRef: cloud-credentials` (Optional:
false), so this Secret MUST exist before the pod can start. Rather than a manual
`kubectl create secret`, the values are stored in Vault and injected at sync time
by argocd-vault-plugin (the app uses pluginName argocd-vault-plugin-helm-with-args,
which runs the rendered manifests through `argocd-vault-plugin generate`, replacing
every <path:...> placeholder).

Vault path (KV v2, mount `secret`):
  secret/data/cert-manager/designate-cloud-credentials
Account: otc-dns (ecosystem_squad_dns / project eu-de_DNS) — able to write TXT
records in the public otc-service.com / tsi-dev Designate zones for DNS-01.

NOTE: intentionally does NOT carry the `app=designate-certmanager-webhook` label,
so the subchart's pre-delete uninstall hook (which deletes by that label) can never
remove this Secret.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: cloud-credentials
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: cert-manager-webhook-designate
    app.kubernetes.io/managed-by: argocd
type: Opaque
stringData:
  OS_AUTH_URL: "<path:secret/data/cert-manager/designate-cloud-credentials#OS_AUTH_URL>"
  OS_REGION_NAME: "<path:secret/data/cert-manager/designate-cloud-credentials#OS_REGION_NAME>"
  OS_IDENTITY_API_VERSION: "<path:secret/data/cert-manager/designate-cloud-credentials#OS_IDENTITY_API_VERSION>"
  OS_USERNAME: "<path:secret/data/cert-manager/designate-cloud-credentials#OS_USERNAME>"
  OS_PASSWORD: "<path:secret/data/cert-manager/designate-cloud-credentials#OS_PASSWORD>"
  OS_PROJECT_NAME: "<path:secret/data/cert-manager/designate-cloud-credentials#OS_PROJECT_NAME>"
  OS_USER_DOMAIN_NAME: "<path:secret/data/cert-manager/designate-cloud-credentials#OS_USER_DOMAIN_NAME>"
  OS_PROJECT_DOMAIN_NAME: "<path:secret/data/cert-manager/designate-cloud-credentials#OS_PROJECT_DOMAIN_NAME>"
