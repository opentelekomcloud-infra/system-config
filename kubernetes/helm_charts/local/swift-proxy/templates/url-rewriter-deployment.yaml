{{- if .Values.urlRewriter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swift-proxy.fullname" . }}-url-rewriter
  labels:
    {{- include "swift-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: url-rewriter
spec:
  replicas: {{ .Values.urlRewriter.replicaCount }}
  selector:
    matchLabels:
      {{- include "swift-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: url-rewriter
  template:
    metadata:
      labels:
        {{- include "swift-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: url-rewriter
    spec:
      containers:
      - name: nginx
        image: {{ .Values.urlRewriter.image.repository }}:{{ .Values.urlRewriter.image.tag }}
        imagePullPolicy: {{ .Values.urlRewriter.image.pullPolicy }}
        {{- if and .Values.urlRewriter.oauth .Values.urlRewriter.oauth.enabled }}
        env:
          - name: SWIFT_USER
            valueFrom:
              secretKeyRef:
                name: {{ include "swift-proxy.fullname" . }}-url-rewriter-auth
                key: SWIFT_USER
          - name: SWIFT_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "swift-proxy.fullname" . }}-url-rewriter-auth
                key: SWIFT_KEY
        {{- end }}
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        volumeMounts:
        - name: nginx-config
          mountPath: {{ .Values.urlRewriter.configPath | default "/etc/nginx/nginx.conf" }}
          subPath: nginx.conf
        resources:
          {{- toYaml .Values.urlRewriter.resources | nindent 10 }}
      volumes:
      - name: nginx-config
        configMap:
          name: {{ include "swift-proxy.fullname" . }}-url-rewriter
{{- end }}
