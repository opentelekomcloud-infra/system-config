{{- if .Values.expirer }}
{{- if .Values.expirer.enabled }}
---
# Kolla config for the object-expirer daemon.
# Without this daemon, objects uploaded with X-Delete-After (zuul_log_delete_after)
# are hidden from GETs once expired but their .data files stay on disk forever, and
# their entries pile up in the .expiring_objects account -> inode exhaustion.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "swift-proxy.fullname" . }}-kolla-expirer-config
  labels:
    {{- include "swift-proxy.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  config.json: |
    {
      "command": "/var/lib/kolla/venv/bin/swift-object-expirer /etc/swift/object-expirer.conf",
      "config_files": [
        {
          "source": "/var/lib/kolla/config_files/swift.conf",
          "dest": "/etc/swift/swift.conf",
          "owner": "swift",
          "perm": "0640"
        },
        {
          "source": "/var/lib/kolla/config_files/object-expirer.conf",
          "dest": "/etc/swift/object-expirer.conf",
          "owner": "swift",
          "perm": "0640"
        }
      ],
      "permissions": [
        {
          "path": "/var/cache/swift",
          "owner": "swift:swift",
          "recurse": true
        }
      ]
    }
  swift.conf: |
    [swift-hash]
    swift_hash_path_suffix = {{ .Values.swift.hashPathSuffix }}
    swift_hash_path_prefix = {{ .Values.swift.hashPathPrefix }}

    [storage-policy:0]
    name = Policy-0
    default = yes

  object-expirer.conf: |
    [DEFAULT]
    user = swift
    log_name = object-expirer
    {{- if .Values.statsd }}
    {{- if and .Values.statsd.enabled .Values.statsd.host }}
    log_statsd_host = {{ .Values.statsd.host }}
    log_statsd_port = {{ .Values.statsd.port | default 8125 }}
    log_statsd_default_sample_rate = {{ .Values.statsd.defaultSampleRate | default "1.0" }}
    log_statsd_sample_rate_factor = {{ .Values.statsd.sampleRateFactor | default "1.0" }}
    log_statsd_metric_prefix = {{ .Values.statsd.metricPrefix | default "swift.otcinfra2" }}
    {{- end }}
    {{- end }}

    [object-expirer]
    interval = {{ .Values.expirer.interval | default 300 }}
    concurrency = {{ .Values.expirer.concurrency | default 1 }}
    # Rate limit so the first run through a large backlog cannot saturate the
    # single storage node.
    tasks_per_second = {{ .Values.expirer.tasksPerSecond | default 5 }}
    report_interval = 300
    recon_cache_path = /var/cache/swift
    # Also drain entries written by older swift versions into the legacy queue.
    dequeue_from_legacy = {{ .Values.expirer.dequeueFromLegacy | default true }}
    process = 0
    processes = 0

    # swift-object-expirer builds its InternalClient from THIS file (it does not
    # support internal_client_conf_path), so the pipeline must be defined here.
    [pipeline:main]
    pipeline = catch_errors proxy-logging cache symlink proxy-server

    [app:proxy-server]
    use = egg:swift#proxy
    account_autocreate = true

    [filter:catch_errors]
    use = egg:swift#catch_errors

    [filter:proxy-logging]
    use = egg:swift#proxy_logging

    [filter:cache]
    use = egg:swift#memcache
    memcache_servers = 127.0.0.1:11211

    [filter:symlink]
    use = egg:swift#symlink
{{- end }}
{{- end }}
{{- end }}
{{- end }}
