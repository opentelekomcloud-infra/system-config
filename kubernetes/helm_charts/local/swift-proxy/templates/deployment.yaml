apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swift-proxy.fullname" . }}
  labels:
    {{- include "swift-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "swift-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      annotations:
        {{- if eq .Values.mode "cluster" }}
        checksum/config: {{ include (print $.Template.BasePath "/swift-config.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "swift-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "swift-proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- if and (eq .Values.mode "cluster") .Values.swift.validatetoken.enabled }}
      initContainers:
        # Install the OTC validatetoken middleware into a shared dir so the
        # kolla swift-proxy venv can import it via PYTHONPATH (keystone docs proxy).
        - name: install-validatetoken
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              /var/lib/kolla/venv/bin/pip install --no-deps \
                --target=/vt-libs \
                validatetoken{{ if .Values.swift.validatetoken.version }}=={{ .Values.swift.validatetoken.version }}{{ end }}
          volumeMounts:
            - name: validatetoken-libs
              mountPath: /vt-libs
      {{- end }}
      containers:
        {{- if and (eq .Values.mode "cluster") (or .Values.swift.tempauth.enabled .Values.swift.validatetoken.enabled) }}
        - name: memcached
          image: memcached:1.6-alpine
          args: ["-m", "64", "-c", "1024", "-u", "memcache"]
          ports:
            - containerPort: 11211
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
        {{- end }}
        - name: swift-proxy
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if eq .Values.mode "cluster" }}
          image: "{{ .Values.proxy.image.repository }}:{{ .Values.proxy.image.tag }}"
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              sudo -E kolla_set_configs
              cp -v /srv/rings/*.ring.gz /etc/swift/
              exec /var/lib/kolla/venv/bin/swift-proxy-server /etc/swift/proxy-server.conf
          env:
            - name: KOLLA_CONFIG_STRATEGY
              value: "COPY_ALWAYS"
            {{- if .Values.swift.validatetoken.enabled }}
            - name: PYTHONPATH
              value: "/vt-libs"
            {{- end }}
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CLOUD_NAMES
              value: "{{ .Values.cloudNames }}"
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.mode "cluster" }}
            - name: kolla-config
              mountPath: /var/lib/kolla/config_files
              readOnly: true
            - name: cache
              mountPath: /var/cache/swift
            - name: swift-rings
              mountPath: /srv/rings
              readOnly: true
            {{- if .Values.swift.validatetoken.enabled }}
            - name: validatetoken-libs
              mountPath: /vt-libs
              readOnly: true
            {{- end }}
            {{- else }}
            - mountPath: /etc/openstack
              name: clouds-config
            {{- end }}
      volumes:
        {{- if eq .Values.mode "cluster" }}
        - name: kolla-config
          configMap:
            name: {{ include "swift-proxy.fullname" . }}-kolla-proxy-config
        - name: cache
          emptyDir: {}
        - name: swift-rings
          configMap:
            name: {{ .Values.swift.ringsConfigMapName | default (printf "%s-rings" (include "swift-proxy.fullname" .)) }}
        {{- if .Values.swift.validatetoken.enabled }}
        - name: validatetoken-libs
          emptyDir: {}
        {{- end }}
        {{- else }}
        - name: clouds-config
          secret:
            secretName: {{ include "swift-proxy.fullname" . }}-clouds
            defaultMode: 420
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
