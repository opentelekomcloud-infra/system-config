{{- if and (eq .Values.mode "cluster") .Values.storage.enabled }}
{{- range $i := until (int .Values.storage.replicas) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "swift-proxy.fullname" $ }}-storage-{{ $i }}
  labels:
    {{- include "swift-proxy.labels" $ | nindent 4 }}
    app.kubernetes.io/component: storage
    swift-storage-node: "{{ $i }}"
spec:
  serviceName: {{ include "swift-proxy.fullname" $ }}-storage
  replicas: 1
  selector:
    matchLabels:
      {{- include "swift-proxy.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: storage
      swift-storage-node: "{{ $i }}"
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/swift-config.yaml") $ | sha256sum }}
      labels:
        {{- include "swift-proxy.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: storage
        swift-storage-node: "{{ $i }}"
    spec:
      {{- with $.Values.serviceAccountName }}
      serviceAccountName: {{ include "swift-proxy.serviceAccountName" $ }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}      {{- if $.Values.storage.persistence.localStorage.enabled }}
      # Node affinity for local storage - must run on node with XFS volume
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ $.Values.storage.persistence.localStorage.nodeName }}
      {{- end }}
      initContainers:
        - name: setup-storage
          image: "{{ $.Values.storage.image.object.repository }}:{{ $.Values.storage.image.object.tag }}"
          imagePullPolicy: {{ $.Values.storage.image.object.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              # Mount NFS directly to /srv/node/sda so Swift sees it as a device mount
              mkdir -p /srv/node
              mkdir -p /srv/node/sda/objects /srv/node/sda/containers /srv/node/sda/accounts /srv/node/sda/tmp
              # Non-recursive: only fix the device dir + the top-level swift dirs.
              # The object data tree can hold millions of files that are already
              # swift-owned; a full `chown -R` on the EVS volume takes ~20m and
              # blocks pod startup (init never completes within a reasonable window).
              chown swift:swift /srv/node/sda /srv/node/sda/objects /srv/node/sda/containers /srv/node/sda/accounts /srv/node/sda/tmp
              chmod 755 /srv/node /srv/node/sda

              echo "Swift storage device directory created"
          volumeMounts:
            - name: storage
              mountPath: /srv/node/sda
            - name: srv-node-parent
              mountPath: /srv/node
          securityContext:
            runAsUser: 0
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "swift-proxy.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: storage
      containers:
        # Swift Object Server
        - name: object-server
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.storage.image.object.repository }}:{{ $.Values.storage.image.object.tag }}"
          imagePullPolicy: {{ $.Values.storage.image.object.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              sudo -E kolla_set_configs
              cp -v /srv/rings/*.ring.gz /etc/swift/
              exec /var/lib/kolla/venv/bin/swift-object-server /etc/swift/object-server.conf
          env:
            - name: KOLLA_CONFIG_STRATEGY
              value: "COPY_ALWAYS"
          ports:
            - name: object
              containerPort: {{ $.Values.storage.ports.object }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: object
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: object
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: kolla-object-config
              mountPath: /var/lib/kolla/config_files
              readOnly: true
            - name: storage
              mountPath: /srv/node/sda
            - name: srv-node-parent
              mountPath: /srv/node
            - name: cache
              mountPath: /var/cache/swift
            - name: swift-rings
              mountPath: /srv/rings
              readOnly: true
          resources:
            {{- toYaml $.Values.storage.resources | nindent 12 }}

        # Swift Container Server
        - name: container-server
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.storage.image.container.repository }}:{{ $.Values.storage.image.container.tag }}"
          imagePullPolicy: {{ $.Values.storage.image.container.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              sudo -E kolla_set_configs
              cp -v /srv/rings/*.ring.gz /etc/swift/
              exec /var/lib/kolla/venv/bin/swift-container-server /etc/swift/container-server.conf
          env:
            - name: KOLLA_CONFIG_STRATEGY
              value: "COPY_ALWAYS"
          ports:
            - name: container
              containerPort: {{ $.Values.storage.ports.container }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: container
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: container
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: kolla-container-config
              mountPath: /var/lib/kolla/config_files
              readOnly: true
            - name: storage
              mountPath: /srv/node/sda
            - name: srv-node-parent
              mountPath: /srv/node
            - name: cache
              mountPath: /var/cache/swift
            - name: swift-rings
              mountPath: /srv/rings
              readOnly: true
          resources:
            {{- toYaml $.Values.storage.resources | nindent 12 }}

        # Swift Account Server
        - name: account-server
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.storage.image.account.repository }}:{{ $.Values.storage.image.account.tag }}"
          imagePullPolicy: {{ $.Values.storage.image.account.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              sudo -E kolla_set_configs
              cp -v /srv/rings/*.ring.gz /etc/swift/
              exec /var/lib/kolla/venv/bin/swift-account-server /etc/swift/account-server.conf
          env:
            - name: KOLLA_CONFIG_STRATEGY
              value: "COPY_ALWAYS"
          ports:
            - name: account
              containerPort: {{ $.Values.storage.ports.account }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: account
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: account
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: kolla-account-config
              mountPath: /var/lib/kolla/config_files
              readOnly: true
            - name: storage
              mountPath: /srv/node/sda
            - name: srv-node-parent
              mountPath: /srv/node
            - name: cache
              mountPath: /var/cache/swift
            - name: swift-rings
              mountPath: /srv/rings
              readOnly: true
          resources:
            {{- toYaml $.Values.storage.resources | nindent 12 }}

        {{- if $.Values.storage.updater }}
        {{- if $.Values.storage.updater.enabled }}
        # Swift Object Updater - drains /srv/node/sda/async_pending, i.e. the
        # container-DB updates that could not be applied synchronously.
        # WITHOUT this daemon async_pending grows without bound (553k files on
        # 2026-08-17) and eventually exhausts the filesystem inodes, which breaks
        # container listings and silently loses log uploads.
        - name: object-updater
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.storage.image.object.repository }}:{{ $.Values.storage.image.object.tag }}"
          imagePullPolicy: {{ $.Values.storage.image.object.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              sudo -E kolla_set_configs
              cp -v /srv/rings/*.ring.gz /etc/swift/
              exec /var/lib/kolla/venv/bin/swift-object-updater /etc/swift/object-server.conf
          env:
            - name: KOLLA_CONFIG_STRATEGY
              value: "COPY_ALWAYS"
          volumeMounts:
            - name: kolla-object-config
              mountPath: /var/lib/kolla/config_files
              readOnly: true
            - name: storage
              mountPath: /srv/node/sda
            - name: srv-node-parent
              mountPath: /srv/node
            - name: cache
              mountPath: /var/cache/swift
            - name: swift-rings
              mountPath: /srv/rings
              readOnly: true
          resources:
            {{- toYaml ($.Values.storage.updater.resources | default $.Values.storage.resources) | nindent 12 }}
        {{- end }}
        {{- end }}

        {{- if $.Values.monitoring }}
        {{- if $.Values.monitoring.enabled }}
        # Exports async_pending depth + object-updater liveness to Prometheus.
        # async_pending has no metric anywhere else, and it is the leading indicator
        # of the inode exhaustion that took swift down on 2026-08-17.
        - name: metrics-exporter
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.storage.image.object.repository }}:{{ $.Values.storage.image.object.tag }}"
          imagePullPolicy: {{ $.Values.storage.image.object.pullPolicy }}
          command: ["python3", "/opt/swift-exporter/exporter.py"]
          env:
            - name: SWIFT_DEVICE
              value: "sda"
            - name: SWIFT_NODE_ROOT
              value: "/srv/node"
            - name: EXPORTER_PORT
              value: "{{ $.Values.monitoring.port | default 9109 }}"
            - name: ASYNC_COUNT_CAP
              value: "{{ $.Values.monitoring.asyncCountCap | default 50000 }}"
          ports:
            - name: metrics
              containerPort: {{ $.Values.monitoring.port | default 9109 }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: metrics-exporter
              mountPath: /opt/swift-exporter
              readOnly: true
            - name: storage
              mountPath: /srv/node/sda
              readOnly: true
            - name: cache
              mountPath: /var/cache/swift
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        {{- end }}
        {{- end }}

      volumes:
        - name: kolla-object-config
          configMap:
            name: {{ include "swift-proxy.fullname" $ }}-kolla-object-config
        - name: kolla-container-config
          configMap:
            name: {{ include "swift-proxy.fullname" $ }}-kolla-container-config
        - name: kolla-account-config
          configMap:
            name: {{ include "swift-proxy.fullname" $ }}-kolla-account-config
        - name: cache
          emptyDir: {}
        - name: swift-rings
          configMap:
            name: {{ include "swift-proxy.fullname" $ }}-rings
        - name: srv-node-parent
          emptyDir: {}
        {{- if $.Values.monitoring }}
        {{- if $.Values.monitoring.enabled }}
        - name: metrics-exporter
          configMap:
            name: {{ include "swift-proxy.fullname" $ }}-metrics-exporter
        {{- end }}
        {{- end }}

  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ "{{ $.Values.storage.persistence.accessMode }}" ]
        {{- if $.Values.storage.persistence.storageClass }}
        storageClassName: {{ $.Values.storage.persistence.storageClass }}
        {{- end }}
        {{- if $.Values.storage.persistence.existingVolume }}
        volumeName: {{ $.Values.storage.persistence.existingVolume }}
        {{- end }}
        resources:
          requests:
            storage: {{ $.Values.storage.persistence.size }}
{{- end }}
{{- end }}
