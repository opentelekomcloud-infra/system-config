# =============================================================================
# graphite (go-carbon + statsd) — Zuul metrics carbon store
# =============================================================================
# k8s port of the ansible-managed graphite1.eco VM (host_vars graphite_cert:
# graphite1-infra, graphite_relay: true, "zuul" storage schema).
#
# Write path : producers -> statsd (:8125/udp) -> relay (:2014) -> go-carbon
#              (:2004) -> whisper on the PVC.
# Read path  : carbonapi (ns graphite) -> go-carbon carbonserver (:8081).
#
# The image bundles go-carbon + statsd + carbon-relay + graphite-web + nginx
# + memcached under supervisord. Only the config that materially differs from
# the image defaults is overridden via the ConfigMap (storage-schemas with the
# zuul retention, go-carbon.conf with carbonserver enabled, statsd udp.js).
# carbon.conf / relay-rules.conf / nginx use the image defaults.
# =============================================================================

nameOverride: ""
fullnameOverride: "graphite-zuul"

namespace: graphite

replicaCount: 1

image:
  # Same bundled image the ansible role uses (roles/graphite defaults).
  repository: quay.io/opentelekomcloud/graphite-statsd
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

podSecurityContext: {}

securityContext: {}

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# ---------------------------------------------------------------------------
# Persistence — whisper database (/opt/graphite/storage).
# graphite1.eco holds ~2.9 GiB whisper; size generously for growth + the
# one-time seed copy from the VM.
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: "csi-disk-retain"
  accessMode: ReadWriteOnce
  size: 20Gi
  mountPath: /opt/graphite/storage

# ---------------------------------------------------------------------------
# In-cluster Service (carbonapi read + in-cluster ingest).
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  ports:
    carbonserver: 8081   # go-carbon carbonserver — carbonapi read path
    carbonLine: 2003     # plaintext carbon receiver
    carbonPickle: 2004   # pickle carbon receiver
    statsd: 8125         # statsd UDP ingest
    web: 80              # graphite-web (nginx) dashboard

# ===========================================================================
# Cross-boundary statsd ingest (producers outside this cluster).
# ===========================================================================
# In-cluster producers (cloudmon, carbonapi) reach go-carbon via the ClusterIP
# Service above — nothing extra needed. The options below are ONLY for external
# producers: today the swift controller VM (192.168.14.241 -> repoint here);
# end state, any producer on otcinfra2 (192.168.171.0/24, already peered).
#
# Zero-VM alignment: no VPC peering / VPN is required — the swift VM already
# routes to otcinfra (192.168.170.0/24) and otcinfra<->otcinfra2 is already
# peered. The ONLY missing prerequisite is an inbound security-group rule on the
# otcinfra worker nodes / ELB allowing the chosen UDP port from the producer
# subnet(s): 192.168.80.0/24 (swift, transitional) + 192.168.171.0/24 (otcinfra2).

# --- PRIMARY: UDP NodePort (no ELB) -----------------------------------------
# Recommended. UDP works natively on NodePort; no dedicated ELB to provision.
# Point the swift controller statsd_graphite_host at a stable otcinfra node IP
# on infra-subnet (e.g. 192.168.170.139) : statsdNodePort. Disabled for prep.
nodePortIngest:
  enabled: false
  statsdNodePort: 31825   # 30000-32767; producer -> <otcinfra-node-ip>:31825/udp

# --- ALTERNATIVE: dedicated ELB VIP -----------------------------------------
# Use only if a stable VIP is preferred over a node IP. statsd is UDP:8125 and
# (verified against CCE LoadBalancer docs 2026-08-10) UDP listeners are supported
# ONLY by DEDICATED load balancers (kubernetes.io/elb.class: performance). The
# existing internal ELBs (elb-intern @192.168.170.129, elb-swift-proxy
# @192.168.170.56, ingress) are all SHARED (union) and cannot do UDP. Fill
# elb.subnet-id (infra-subnet) + elb.autocreate (or elb.id) before enabling.
loadBalancer:
  enabled: false
  annotations:
    kubernetes.io/elb.class: performance
    kubernetes.io/elb.pass-through: onlyLocal
    # kubernetes.io/elb.subnet-id: "<infra-subnet id>"   # openstack subnet show infra-subnet
    # kubernetes.io/elb.autocreate: '{"type":"inner","name":"elb-graphite-ingest"}'
    # kubernetes.io/elb.id: "<pre-created dedicated internal ELB id>"
  loadBalancerIP: ""
  ports:
    statsd: 8125
    carbonLine: 2003
    carbonPickle: 2004

# ---------------------------------------------------------------------------
# go-carbon / statsd runtime env (roles/graphite templates/env.j2).
# ---------------------------------------------------------------------------
env:
  GOCARBON: "1"
  RELAY: "1"
  # Image bundles memcached; graphite-web caches locally.
  MEMCACHE_HOST: "127.0.0.1:11211"

# ---------------------------------------------------------------------------
# storage-schemas.conf — from host_vars/graphite1.eco (the "zuul" store).
# ---------------------------------------------------------------------------
storageSchemas: |
  ["zuul"]
  pattern = ^stats\.*\.zuul\.*
  retentions = 60:90d

  ["carbon"]
  pattern = ^carbon\.*
  retentions = 60:90d

  ["default"]
  pattern = .*
  retentions = 60s:1d,5m:30d,10m:90d
