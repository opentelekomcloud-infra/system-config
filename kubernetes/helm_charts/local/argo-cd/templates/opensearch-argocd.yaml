# OpenSearch (otcinfra logging cluster) — GitOps ArgoCD Application.
#
# Deliberately a STANDALONE Application (not part of the auto-synced
# `applications` list in values.yaml) and with NO automated syncPolicy: the
# live cluster is a 3-node stateful store on OpenSearch 2.19.5 whose last helm
# releases are in status=FAILED, and this chart pins 3.8.0 (a MAJOR upgrade).
# Auto-sync/self-heal/prune would attempt that upgrade on merge and risk an
# outage/data loss. Sync MANUALLY only after: index snapshot, clearing the
# failed release, reviewing the chart-3.x values, and inside a maintenance
# window. Once opensearch is on 3.x and stable, this can be folded into the
# auto-synced `applications` list.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-otcinfra
  namespace: {{ .Values.global.argocdNamespace }}
spec:
  project: {{ .Values.global.infraProject }}
  destination:
    name: otcinfra
    namespace: opensearch
  source:
    repoURL: 'https://github.com/opentelekomcloud-infra/system-config.git'
    targetRevision: main
    path: kubernetes/helm_charts/upstream/opensearch
    helm:
      valueFiles:
        - values-otcinfra.yaml
  # No `syncPolicy.automated` — manual sync only (see header). Namespace
  # already exists; ServerSideApply avoids last-applied-config conflicts when
  # adopting the existing Helm-managed resources.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
