{{- if .Values.swrSecret }}
{{- if .Values.swrSecret.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.swrSecret.name | default "swr-secret" }}
  namespace: {{ .Values.swrSecret.namespace | default "argocd" }}
  labels:
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: image-pull-secret
  annotations:
    managed-by: argocd.argoproj.io
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "{{ .Values.swrSecret.registry | default "swr.eu-de.otc-t-systems.com" }}": {
          "username": "<path:secret/data/swr/swr#swr_username>",
          "password": "<path:secret/data/swr/swr#login_key>"
        }
      }
    }
{{- end }}
{{- end }}
