repositorySecret:
  enabled: true
  name: repository-system-config-github
  namespace: argocd-k8s
  data:
    name: c3lzdGVtLWNvbmZpZ19naXRodWI=
    # project intentionally omitted -> global credential (system-config is used
    # by apps across multiple AppProjects: default, infra, ...).
    project: ""
    type: Z2l0
    url: aHR0cHM6Ly9naXRodWIuY29tL29wZW50ZWxla29tY2xvdWQtaW5mcmEvc3lzdGVtLWNvbmZpZy5naXQ=
  # HTTPS read credential for private GitHub repos, resolved by argocd-vault-plugin.
  # Reuses the shared org GitHub credential in Vault at secret/argocd/repositories/github
  # (fields: username = GitHub account/bot login, password = PAT that can read
  # opentelekomcloud-infra private repos).
  stringData:
    username: "<path:secret/data/argocd/repositories/github#username>"
    password: "<path:secret/data/argocd/repositories/github#password>"
