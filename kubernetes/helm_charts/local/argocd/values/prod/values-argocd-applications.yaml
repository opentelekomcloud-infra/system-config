  # NOTE: opensearch + monitoring (grafana + alerta) are intentionally NOT
  # wired here yet. The GitOps charts exist (kubernetes/helm_charts/
  # upstream/opensearch, local/opensearch, local/grafana, local/alerta) but
  # these services stay on the OLD ansible/bridge setup for now and will be
  # set up on the new cluster later. Add the app entries then.
  #
  # graphite (go-carbon + carbonapi + graphite-web) is the k8s port of the
  # graphite1.eco VM: whisper on a csi-disk-retain PVC, carbonserver :8081 for
  # carbonapi, statsd :8125 ingest. It runs on the otcinfra cluster.
  #
  # Wired with MANUAL sync (no automated prune/selfHeal) because this is a live
  # stateful migration: the go-carbon StatefulSet is helm-installed first, then
  # the 2.9 GiB whisper seed + statsd/carbonapi repoint happen in a coordinated
  # cutover window (repoint swift controller statsd_graphite_host from
  # 192.168.14.241 to the ingest VIP, repoint the carbonapi 'zuul' backend, then
  # retire graphite1.eco). carbonapi + graphite-web stay gated off
  # (carbonapi.enabled / graphiteWeb.enabled = false) until the ansible-managed
  # objects of the same name are retired. targetRevision tracks the migration
  # branch until the chart lands on main.
  - name: graphite
    clusters: [otcinfra]
    config:
      namespace: graphite
      repoURL: 'https://github.com/opentelekomcloud-infra/system-config.git'
      targetRevision: 'Zuul_job_migration_fixes'
      path: kubernetes/helm_charts/local/graphite
      pluginName: argocd-vault-plugin-helm-with-args
      pluginEnv: '-f values-prod.yaml'
      project: infra
      syncPolicy:
        syncOptions:
          - CreateNamespace=true

  # opensearch-otcinfra is the GitOps port of the ansible-managed OpenSearch +
  # OpenSearch Dashboards on the otcinfra cluster (ns opensearch). The umbrella
  # chart (upstream/opensearch) bundles both subcharts and pins them to 3.8.0 —
  # a MAJOR, NOT-skip-safe upgrade from the live 2.19.5.
  #
  # App name is DELIBERATELY new (`opensearch-otcinfra`, not `opensearch`): the
  # CMP plugin renders `helm template $ARGOCD_APP_NAME`, so the release name — and
  # thus the `app.kubernetes.io/instance` selector labels — differ from the legacy
  # ansible releases (`opensearch` / `opensearch-dashboards`). The old dashboards
  # release is already FAILED on an immutable Deployment.spec.selector patch; the
  # data StatefulSet has the same problem, so the existing `opensearch-cluster-master`
  # STS must be orphan-deleted (PVCs retained) and re-adopted during the window.
  #
  # MANUAL sync (no automated prune/selfHeal) — this is a live, stateful, major
  # upgrade. DO NOT sync until the runbook prerequisites are done:
  #   1. register a snapshot repository + take & verify an index snapshot,
  #   2. disable/clear the ansible helm-chart entries (already commented out in
  #      inventory k8s-controller.yaml) and clear the FAILED helm releases,
  #   3. review the chart-3.x values schema, inside a maintenance window.
  # Dashboards creds (kibanaserver) are resolved at sync time by the AVP CMP from
  # Vault `secret/opensearch/kibanaserver` (argocd-ro can read secret/data/*) —
  # no hand-made k8s secret needed.
  # targetRevision tracks the migration branch until the chart lands on main.
  - name: opensearch-otcinfra
    clusters: [otcinfra]
    config:
      namespace: opensearch
      repoURL: 'https://github.com/opentelekomcloud-infra/system-config.git'
      targetRevision: 'Zuul_job_migration_fixes'
      path: kubernetes/helm_charts/upstream/opensearch
      pluginName: argocd-vault-plugin-helm-with-args
      pluginEnv: '-f values-prod.yaml'
      project: infra
      syncPolicy:
        syncOptions:
          - CreateNamespace=true

  # haproxy is the GitOps port of the ansible-managed proxy1/proxy2.eco (haproxy)
  # mgmt-net VMs — the public reverse-proxy / TLS terminator. The local chart
  # holds a FAITHFUL lift-and-shift of the live proxy1 /etc/haproxy/haproxy.cfg
  # (all frontends + backends + attacker blocklist + rate-limit + HSTS), fronted
  # by a NEW dedicated EIP LoadBalancer so each still-proxied host is DNS-cut over
  # one at a time (proxy1/proxy2 stay as the instant fallback).
  #
  # MANUAL sync. DO NOT sync until:
  #   1. certificates.clusterIssuer (a DNS-01 issuer for the OTC zones) is
  #      provisioned — the cluster only has HTTP-01 issuers today,
  #   2. service.loadBalancer.annotations autocreate JSON has real bandwidth /
  #      flavor / infra-subnet network id (REPLACE_ placeholders),
  #   3. pod->target reachability is verified (VM backends keycloak/vault/influx/
  #      gitea on the mgmt net; 170.6 otcinfra ingress; 171.6 otcinfra2 via peering).
  # The searchuser Basic-auth injection (docs-search) resolves at sync time from
  # Vault secret/opensearch/searchuser via the AVP CMP — no k8s secret in git.
  - name: haproxy
    clusters: [otcinfra]
    config:
      namespace: proxy
      repoURL: 'https://github.com/opentelekomcloud-infra/system-config.git'
      targetRevision: 'Zuul_job_migration_fixes'
      path: kubernetes/helm_charts/local/haproxy
      pluginName: argocd-vault-plugin-helm-with-args
      pluginEnv: '-f values-prod.yaml'
      project: infra
      syncPolicy:
        syncOptions:
          - CreateNamespace=true

  # cert-manager-webhook-designate is the UPSTREAM SysEleven Designate webhook
  # (github.com/syseleven/designate-certmanager-webhook) deployed as a STANDALONE
  # ArgoCD app (a Helm-repo chart source, NOT a dependency of the cert-manager
  # chart). It registers the DNS-01 solver APIService `acme.syseleven.de` that the
  # haproxy chart's `otc-dns01` ClusterIssuer references, letting cert-manager
  # solve DNS-01 challenges against the OTC (OpenStack Designate) zones.
  #
  # The helm repo is registered in values-argocd-repositories.yaml
  # (extraRepositories → syseleven-designate-webhook).
  #
  # certManager.serviceAccountName MUST be the live SA (`cert-manager-otcinfra`)
  # so the webhook's RBAC lets cert-manager invoke it. The OpenStack credentials
  # secret (`cloud-credentials`, in ns cert-manager) is provisioned separately —
  # it needs an account that can write TXT records in the public otc-service.com /
  # tsi-dev zones (the `otc-dns` account), a vault-admin prerequisite.
  - name: cert-manager-webhook-designate
    clusters: [otcinfra]
    config:
      namespace: cert-manager
      repoURL: 'https://syseleven.github.io/designate-certmanager-webhook'
      targetRevision: '0.9.2'
      chart: designate-certmanager-webhook
      helm:
        releaseName: designate-certmanager-webhook
        valuesObject:
          certManager:
            namespace: cert-manager
            serviceAccountName: cert-manager-otcinfra
      project: infra
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

