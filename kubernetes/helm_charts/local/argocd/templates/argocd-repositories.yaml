{{- if and .Values.repositorySecret (hasKey .Values.repositorySecret "enabled") .Values.repositorySecret.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    managed-by: argocd.argoproj.io
  labels:
    argocd.argoproj.io/secret-type: repository
  name: {{ .Values.repositorySecret.name }}
  namespace: {{ .Values.repositorySecret.namespace | default $.Release.Namespace }}
type: Opaque
data:
  name: {{ .Values.repositorySecret.data.name | quote }}
  {{- with .Values.repositorySecret.data.project }}
  project: {{ . | quote }}
  {{- end }}
  type: {{ .Values.repositorySecret.data.type | quote }}
  url: {{ .Values.repositorySecret.data.url | quote }}
{{- with .Values.repositorySecret.stringData }}
stringData:
  {{- range $key, $val := . }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- range .Values.extraRepositories }}
---
# Additional (public) Helm/Git repository registration so ArgoCD can pull
# chart-type Application sources (e.g. the SysEleven Designate webhook chart).
apiVersion: v1
kind: Secret
metadata:
  annotations:
    managed-by: argocd.argoproj.io
  labels:
    argocd.argoproj.io/secret-type: repository
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
type: Opaque
stringData:
  name: {{ .repoName | quote }}
  type: {{ .type | quote }}
  url: {{ .url | quote }}
{{- end }}
