{{- range .Values.instances }}
---
# Alerta config as a Secret (contains DB/LDAP/app secrets). The <path:...>
# placeholders are resolved by argocd-vault-plugin at sync time from
# vault-otcinfra2; the alerta container mounts these as its config files.
apiVersion: v1
kind: Secret
metadata:
  name: alerta-secret-{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: alerta
    app.kubernetes.io/instance: {{ .name | quote }}
    {{- include "alerta.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  alertad.conf: |
{{ .serverConfig | indent 4 }}
  alerta.conf: |
{{ .clientConfig | indent 4 }}
{{- end }}
