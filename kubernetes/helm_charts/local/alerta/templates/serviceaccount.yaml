{{- range .Values.instances }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .serviceAccountName }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: alerta
    app.kubernetes.io/instance: {{ .name | quote }}
    {{- include "alerta.commonLabels" $ | nindent 4 }}
---
# tokenreview binding used by the pod's projected SA token (kept from the
# former ansible role for parity with the vault k8s-auth login path).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .serviceAccountName }}-{{ .name }}-tokenreview-binding
  labels:
    app.kubernetes.io/name: alerta
    app.kubernetes.io/instance: {{ .name | quote }}
    {{- include "alerta.commonLabels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccountName }}
    namespace: {{ .namespace }}
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
{{- end }}
