{{- range .Values.instances }}
---
apiVersion: v1
kind: Service
metadata:
  name: alerta-service-{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: alerta
    app.kubernetes.io/instance: {{ .name | quote }}
    {{- include "alerta.commonLabels" $ | nindent 4 }}
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/name: alerta
    app.kubernetes.io/instance: {{ .name | quote }}
{{- end }}
