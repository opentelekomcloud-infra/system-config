---
{{- /*
Additional Opaque Secrets rendered from Vault via argocd-vault-plugin.
Values carry <path:...> placeholders that AVP substitutes at sync time.
Used for e.g. the SysEleven Designate webhook's `cloud-credentials` (OpenStack
DNS account for ACME DNS-01 solving).
*/ -}}
{{- range .Values.additionalSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  {{- if .namespace }}
  namespace: {{ .namespace }}
  {{- end }}
  labels:
    app.kubernetes.io/managed-by: argocd
type: {{ .type | default "Opaque" }}
stringData:
  {{- toYaml .stringData | nindent 2 }}
---
{{- end }}
