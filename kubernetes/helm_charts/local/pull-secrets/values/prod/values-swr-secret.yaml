# Cluster-wide image pull secret configuration for prod
# Deployed in the `argocd-k8s` namespace and replicated to every namespace by the
# kubernetes-replicator, so pods/SAs do not need per-namespace imagePullSecrets.

swrSecret:
  enabled: true
  name: swr-secret
  namespace: argocd-k8s
  registry: swr.eu-de.otc.t-systems.com
