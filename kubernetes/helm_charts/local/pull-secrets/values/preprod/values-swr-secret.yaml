# Cluster-wide image pull secret configuration for preprod
# Deployed in the `default` namespace and replicated to every namespace by the
# kubernetes-replicator, so pods/SAs do not need per-namespace imagePullSecrets.

swrSecret:
  enabled: true
  name: swr-secret
  namespace: default
  registry: https://swr.eu-de.otc.t-systems.com
