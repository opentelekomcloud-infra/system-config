{{- if and .Values.swrSecret .Values.swrSecret.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.swrSecret.name | default "swr-secret" }}
  namespace: {{ .Values.swrSecret.namespace | default "default" }}
  annotations:
    # Replicate this secret to ALL namespaces so that any ServiceAccount that
    # mounts it as imagePullSecrets (via the default service account or per-pod)
    # can pull from SWR without needing a per-namespace copy.
    replicator.v1.mittwald.de/replicate-to: ".*"
    replicator.v1.mittwald.de/replicate-to-matching: "true"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "{{ .Values.swrSecret.registry | default "swr.eu-de.otc.t-systems.com" }}": {
          "auth": "<path:secret/data/swr/swr#swr_auth_base64>"
        }
      }
    }
{{- end }}
