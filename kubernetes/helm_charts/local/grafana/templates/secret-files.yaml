{{- range .Values.instances }}
---
# Secret mounted at /vault-data — replaces the retired vault-agent. Each key is
# a file grafana reads via $__file{/vault-data/<key>} (env + ldap.toml). The
# <path:...> placeholders are resolved by argocd-vault-plugin at sync time from
# vault-otcinfra2.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secretfiles-{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .name | quote }}
    {{- include "grafana.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  database_username: "<path:{{ .vaultDbPath }}#username>"
  database_password: "<path:{{ .vaultDbPath }}#password>"
  security_admin_password: "<path:{{ .vaultDashboardPath }}#security_admin_password>"
  security_generic_oauth_client_id: "<path:{{ .vaultDashboardPath }}#grafana_kc_client_id>"
  security_generic_oauth_client_secret: "<path:{{ .vaultDashboardPath }}#grafana_kc_client_secret>"
  ldap_password: "<path:{{ .vaultLdapPath }}#bind_password>"
  ldap_ca_cert: "<path:{{ .vaultLdapPath }}#ca_crt>"
  smtp_gw_host: "<path:{{ .vaultSmtpPath }}#host>"
  smtp_gw_user: "<path:{{ .vaultSmtpPath }}#username>"
  smtp_gw_password: "<path:{{ .vaultSmtpPath }}#password>"
{{- end }}
