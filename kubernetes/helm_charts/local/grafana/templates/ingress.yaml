{{- range .Values.instances }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress-{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .name | quote }}
    {{- include "grafana.commonLabels" $ | nindent 4 }}
  annotations:
    {{- if .clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .clusterIssuer | quote }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .fqdn | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service-{{ .name }}
                port:
                  number: 3000
  tls:
    - hosts:
        - {{ .fqdn | quote }}
      secretName: {{ .tlsSecretName | quote }}
{{- end }}
