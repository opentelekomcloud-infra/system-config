{{- range .Values.instances }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment-{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .name | quote }}
    {{- include "grafana.commonLabels" $ | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .name | quote }}
    spec:
      serviceAccountName: {{ .serviceAccountName }}
      hostAliases:
        {{- if .ldapServerIp }}
        - ip: {{ .ldapServerIp | quote }}
          hostnames:
            - ldap.otc-service.internal
        {{- end }}
        - ip: "127.0.0.1"
          hostnames:
            - {{ .fqdn | quote }}
        {{- if .graphiteInternalIp }}
        - ip: {{ .graphiteInternalIp | quote }}
          hostnames:
            - graphite-ca.eco.tsi-dev.otc-service.com
        {{- end }}
        {{- if .graphiteWebIp }}
        - ip: {{ .graphiteWebIp | quote }}
          hostnames:
            - graphite.eco.tsi-dev.otc-service.com
        {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - {{ .name | quote }}
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - grafana
      containers:
        - name: grafana-renderer
          image: {{ .rendererImage | quote }}
          ports:
            - containerPort: 8081
        - name: grafana
          image: {{ .grafanaImage | quote }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_RENDERING_SERVER_URL
              value: http://localhost:8081/render
            - name: GF_RENDERING_CALLBACK_URL
              value: http://{{ .fqdn }}:3000
            {{- if .plugins }}
            - name: GF_INSTALL_PLUGINS
              value: {{ .plugins | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: grafana-secret-{{ .name }}
          readinessProbe:
            httpGet:
              path: /login
              scheme: HTTP
              port: 3000
          livenessProbe:
            httpGet:
              path: /healthz
              scheme: HTTP
              port: 3000
          volumeMounts:
            - name: vault-data
              mountPath: /vault-data
              readOnly: true
            - name: grafana-config-ldap
              mountPath: /etc/grafana/ldap
              readOnly: true
      volumes:
        - name: vault-data
          secret:
            secretName: grafana-secretfiles-{{ .name }}
        - name: grafana-config-ldap
          configMap:
            name: grafana-config-{{ .name }}
            items:
              - key: ldap.toml
                path: ldap.toml
{{- end }}
