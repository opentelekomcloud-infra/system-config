{{- range .Values.instances }}
---
# Grafana env config (envFrom). Reproduced verbatim from the live
# grafana-secret-<instance>; contains NO real secrets — its secret-looking
# values are $__file{/vault-data/...} references populated by the AVP
# grafana-secretfiles Secret.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret-{{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .name | quote }}
    {{- include "grafana.commonLabels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
