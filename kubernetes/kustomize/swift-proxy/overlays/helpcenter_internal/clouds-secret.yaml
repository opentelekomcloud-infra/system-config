# Rendered by argocd-vault-plugin. The credential lives in Vault KV; only the
# non-secret routing values are in git.
#
# TEMPORARILY back on swift.eco: zuul-storage-proxy mis-frames the gzipped
# response from swift-proxy-docs (which is behind ingress-nginx) - it sets
# Transfer-Encoding: chunked but writes the raw gzip body, so nginx rejects it
# with "upstream sent invalid chunked response". Content here is stale but
# served. Re-point once the gzip handling is fixed.
apiVersion: v1
kind: Secret
metadata:
  name: swift-proxy-clouds
type: Opaque
stringData:
  clouds.yaml: |
    clouds:
      logs:
        auth:
          auth_url: <path:secret/data/cloud_users/448_log_writer#auth_url>
          username: <path:secret/data/cloud_users/448_log_writer#username>
          password: <path:secret/data/cloud_users/448_log_writer#password>
          project_name: eu-de_docs_int
          user_domain_name: <path:secret/data/cloud_users/448_log_writer#user_domain_name>
        auth_type: password
        region_name: eu-de
        interface: public
        object_store_endpoint_override: https://swift.eco.tsi-dev.otc-service.com/v1/AUTH_21aff786cf5d4637abb468c676ce3a28
