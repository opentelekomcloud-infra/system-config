---
# Rendered by argocd-vault-plugin. The credential lives in Vault KV; only the
# non-secret routing values are in git.
#
# object_store_endpoint_override points at the NEW k8s swift docs proxy. The
# old value (swift.eco.tsi-dev.otc-service.com) is where publishing STOPPED
# writing, which is why the internal portal served 9-day-stale docs.
apiVersion: v1
kind: Secret
metadata:
  name: swift-proxy-clouds
type: Opaque
stringData:
  clouds.yaml: |
    clouds:
      logs:
        auth:
          auth_url: <path:secret/data/cloud_users/448_log_writer#auth_url>
          username: <path:secret/data/cloud_users/448_log_writer#username>
          password: <path:secret/data/cloud_users/448_log_writer#password>
          project_name: eu-de_docs_int
          user_domain_name: <path:secret/data/cloud_users/448_log_writer#user_domain_name>
        auth_type: password
        region_name: eu-de
        interface: public
        object_store_endpoint_override: https://swift-proxy-docs.eco.tsi-dev.otc-service.com/v1/AUTH_21aff786cf5d4637abb468c676ce3a28
