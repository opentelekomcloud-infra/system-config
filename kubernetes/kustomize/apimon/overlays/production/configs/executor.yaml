# Executor config for production
secure: /etc/apimon_secure/apimon-executor-secure.yaml
gear:
  - host: apimon-gearman.apimon-production.svc.cluster.local
    port: 4730
log:
  config: /etc/apimon/logging.conf
alerta:
  endpoint: http://alerta:80
executor:
  work_dir: /var/lib/apimon
  socket: /tmp/executor.socket
  zone: production_eu-de
  logs_cloud: swift
  load_multiplier: 2
metrics:
  statsd:
    host: 192.168.110.58
    port: 8125
