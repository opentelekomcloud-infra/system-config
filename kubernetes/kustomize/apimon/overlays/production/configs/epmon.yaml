# EPmon config for production
    secure: /etc/apimon_secure/scheduler-secure.yaml
gear:
  - host: 0.0.0.0
    port: 4730
    start: true
log:
  config: /etc/apimon/logging.conf
alerta:
  endpoint: http://alerta:80
epmon:
  socket: /tmp/epmon.socket
  zone: production_eu-de
  clouds:
    - production_eu-de:
        service_override:
          Anti-DDoS: {}
          antiddos:
            service: anti_ddos
            urls:
              - "/"
              - "/antiddos"
              - "/antiddos/query_config_list"
              - "/antiddos/default/config"
              - "/antiddos/weekly"
          as:
            service: auto_scaling
            urls:
              - "/"
              - "/scaling_group"
              - "/scaling_configuration"
              - "/scaling_policy"
          asv1: {}
          cce: {}
          ccev2.0:
            service: cce
            urls:
              - "/clusters"
          ces:
            service: ces
            urls:
              - "/"
              - "/metrics"
              - "/alarms"
          cesv1: {}
          compute:
            urls:
              - "/"
              - "/servers"
              - "/flavors"
              - "/limits"
              - "/os-keypairs"
              - "/os-server-groups"
              - "/os-availability-zone"
          cinder:
            service: block_storage
            urls:
              - "/volumes"
              - "/snapshots"
              - "/backups"
              - "/os-volume-transfer"
              - "/os-availability-zone"
          volumev2: {}
          volumev3: {}
          css:
            service: css
            urls:
              - "/"
              - "/clusters"
          cts: {}
          ctsv2:
            service: cts
            urls:
              - "/"
          dcs:
            service: dcs
            urls:
              - "/"
              - "/instances"
              - "/quota"
          dcsv1: {}
          ddsv3:
            service: dds
            urls:
              - "/"
              - "/v3"
              - "/instances"
          deh:
            urls:
              - "/"
              - "/dedicated-hosts"
          dis: {}
          disv2:
            urls:
              - "/"
              - "/streams"
              - "/stream/tags"
          dms:
            service: dms
            urls:
              - "/queues"
              - "/quotas/dms"
              - "/queue/tags"
          dmsv2: {}
          dns:
            urls:
              - "/"
              - "/zones"
              - "/recordsets"
              - "/reverse/floatingips"
          dws:
            urls:
              - "/"
              - "/clusters"
              - "/snaphosts"
          dwsv1: {}
          ed:
            urls:
              - "/api/health"
          enterprise-dashboard: {}
          enterprise-dashboard-v1: {}
          identity:
            urls:
              - "/"
              - "/regions"
              - "/auth/projects"
          image:
            urls:
              - "/"
              - "/images"
              - "/schemas/images"
          kms: {}
          kmsv1:
            service: kms
            urls:
              - "/"
              - "/kms/list-keys"
              - "/kms/user-quotas"
          mrsv1:
            service: mrs
            urls:
              - "/data-sources"
              - "/cluster_infos"
              - "/job-binaries"
          nat:
            urls:
              - "/"
              - "/v2.0"
              - "/nat_gateways"
              - "/snat_rules"
              - "/dnat_rules"
          network:
            urls:
              - "/"
              - "/networks"
              - "/subnets"
              - "/ports"
              - "/routers"
              - "/floatingips"
              - "/security-groups"
              - "/subnetpools"
          object: {}
          object-store:
            service: object_store
            urls:
              - "/"
              - "/info"
          orchestration:
            urls:
              - "/stacks"
              - "/build_info"
              - "/software_configs"
              - "/resource_types"
          heat: {}
          database: {}
          rds: {}
          rdsv1: {}
          rdsv3:
            service: rds
            urls:
              - "/"
              - "/datastores/postgresql"
              - "/instances"
              - "/configurations"
          bms: {}
          data-protect: {}
          sdrs:
            urls:
              - "/"
              - "/v1"
              - "/active-domains"
              - "/server-groups"
              - "/protected-instances"
              - "/replications"
          sfsturbo:
            urls:
              - "/sfs-turbo/shares/detail"
          sharev2:
            service: share
            urls:
              - "/"
              - "/v2"
              - "/shares"
          smn:
            urls:
              - "/"
              - "/notifications"
              - "/notifications/subscriptions"
              - "/notifications/message_template"
          smnv2: {}
          load-balancer: {}
          wks: {}
          workspace: {}
          orchestration: {}
          ief: {}
