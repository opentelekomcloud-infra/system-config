---
# Nodepool configuration for Zuul prod environment

elements-dir: /etc/nodepool/elements
images-dir: /opt/nodepool/images

zookeeper-servers:
  - host: zookeeper.zuul-ci.svc.cluster.local
    port: 2281

zookeeper-tls:
  cert: /tls/client/tls.crt
  key: /tls/client/tls.key
  ca: /tls/client/ca.crt

labels:
  - name: debian
    min-ready: 0
    max-ready-age: 600

  - name: zuul-debian
    min-ready: 0
    max-hold-age: 7200
    # Auto-delete idle ready nodes after 10 min so leftover nodes from
    # dequeued/cancelled buildsets don't accumulate on the pool.
    max-ready-age: 600

  # Builder image — for jobs that build container images.
  # Image: quay.io/buildah/stable — Fedora-based, ships buildah + podman + skopeo
  # + fuse-overlayfs. Runs privileged so buildah can do rootful builds.
  - name: zuul-debian-builder
    min-ready: 0
    max-hold-age: 7200
    max-ready-age: 600

  # Debian pod with a container runtime — for functional tests that need
  # podman (e.g. rancher-integration-tests). Same Debian python-tox image
  # as zuul-debian, but privileged with the vfs storage driver so podman
  # (installed at job runtime) can run rootful containers.
  - name: zuul-debian-podman
    min-ready: 0
    max-hold-age: 7200
    max-ready-age: 600

  # Privileged Debian pod for jobs that run a container runtime inside
  # the Zuul pod (e.g. CloudMon deploys graphite/statsd/postgres via
  # docker). Runs privileged so dockerd can set up bridge networking
  # (CAP_NET_ADMIN); /var/lib/docker lives on an emptyDir.
  - name: zuul-debian-docker
    min-ready: 0
    max-hold-age: 7200

providers:
  # Kubernetes provider for pod-based nodes (in-cluster)
  - name: prod-k8s
    driver: kubernetes
    max-servers: 10
    context: prod
    pools:
      - name: default
        labels:
          - name: zuul-debian
            type: pod
            spec:
              imagePullSecrets:
                - name: quay-image-pull-secret
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              volumes:
                - name: zuul-ssh-keys
                  secret:
                    secretName: zuul-ssh-keys
                    defaultMode: 0600
                - name: zuul-home
                  emptyDir: {}
              containers:
                - name: zuul-debian
                  image: quay.io/opentelekomcloud/python-tox:latest
                  imagePullPolicy: Always
                  command: ["/bin/sh", "-c"]
                  args: ["sleep infinity"]
                  env:
                    - name: HOME
                      value: /home/zuul
                    - name: USER
                      value: zuul
                  volumeMounts:
                    - name: zuul-ssh-keys
                      mountPath: /etc/zuul-ssh-keys
                      readOnly: true
                    - name: zuul-home
                      mountPath: /home/zuul
                  resources:
                    requests:
                      cpu: "200m"
                      memory: "1Gi"
                    limits:
                      cpu: "2"
                      memory: "10Gi"
            python-path: /usr/bin/python3
            shell-type: sh
            context: prod

          # Docker pod — same base image as zuul-debian but privileged,
          # for jobs that install and run docker inside the pod (CloudMon
          # deploy). Privileged is required so dockerd can configure
          # bridge networking (iptables/NAT); /var/lib/docker is backed
          # by an emptyDir so it survives pod restarts within a job.
          #
          # Only stackmon/cloudmon deploy jobs are expected to request this
          # label. Anything that merely builds images should use
          # zuul-debian-builder (buildah, no daemon) instead.
          - name: zuul-debian-docker
            type: pod
            spec:
              imagePullSecrets:
                - name: quay-image-pull-secret
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              volumes:
                - name: zuul-ssh-keys
                  secret:
                    secretName: zuul-ssh-keys
                    defaultMode: 0600
                - name: zuul-home
                  emptyDir: {}
                - name: docker-storage
                  emptyDir:
                    sizeLimit: 20Gi
              containers:
                - name: zuul-debian-docker
                  image: quay.io/opentelekomcloud/python-tox:latest
                  imagePullPolicy: Always
                  command: ["/bin/sh", "-c"]
                  # The pod network runs at MTU 1442, but dockerd defaults its
                  # bridge to 1500. Job containers then emit oversized frames
                  # and TLS to external hosts blackholes on broken PMTU
                  # discovery - the same failure the Gitea runners hit. Seed
                  # the daemon config here so it applies whenever the job
                  # starts dockerd.
                  args:
                    - |
                      mkdir -p /etc/docker
                      printf '{"mtu": 1442}\n' > /etc/docker/daemon.json
                      exec sleep infinity
                  securityContext:
                    privileged: true
                  env:
                    - name: HOME
                      value: /home/zuul
                    - name: USER
                      value: zuul
                  volumeMounts:
                    - name: zuul-ssh-keys
                      mountPath: /etc/zuul-ssh-keys
                      readOnly: true
                    - name: zuul-home
                      mountPath: /home/zuul
                    - name: docker-storage
                      mountPath: /var/lib/docker
                  resources:
                    requests:
                      cpu: "500m"
                      memory: "1Gi"
                      ephemeral-storage: "2Gi"
                    limits:
                      cpu: "4"
                      memory: "6Gi"
                      ephemeral-storage: "20Gi"
            python-path: /usr/bin/python3
            shell-type: sh
            context: prod

          # Builder pod — buildah/podman/skopeo pre-installed.
          # Runs privileged for rootful buildah; uses HOME=/home/build
          # (the upstream image's default user). zuul-infra playbooks
          # target this via ansible_kubectl_pod: zuul-debian-builder.
          - name: zuul-debian-builder
            type: pod
            spec:
              imagePullSecrets:
                - name: quay-image-pull-secret
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              volumes:
                - name: zuul-ssh-keys
                  secret:
                    secretName: zuul-ssh-keys
                    defaultMode: 0600
                - name: zuul-home
                  emptyDir: {}
                - name: containers-storage
                  emptyDir: {}
              containers:
                - name: zuul-debian-builder
                  image: quay.io/buildah/stable:latest
                  imagePullPolicy: Always
                  command: ["/bin/sh", "-c"]
                  args: ["sleep infinity"]
                  securityContext:
                    privileged: true
                  env:
                    - name: HOME
                      value: /home/zuul
                    - name: USER
                      value: zuul
                    - name: STORAGE_DRIVER
                      value: vfs
                  volumeMounts:
                    - name: zuul-ssh-keys
                      mountPath: /etc/zuul-ssh-keys
                      readOnly: true
                    - name: zuul-home
                      mountPath: /home/zuul
                    - name: containers-storage
                      mountPath: /var/lib/containers
                  resources:
                    requests:
                      cpu: "500m"
                      memory: "1Gi"
                    limits:
                      cpu: "4"
                      memory: "6Gi"
            python-path: /usr/bin/python3
            shell-type: sh
            context: prod

          # Debian pod with podman — for functional tests needing a
          # container runtime (rancher-integration-tests). Reuses the
          # Debian python-tox image; runs privileged with the vfs storage
          # driver so podman (installed at job runtime) can run rootful
          # containers without a VM/Docker daemon.
          - name: zuul-debian-podman
            type: pod
            spec:
              imagePullSecrets:
                - name: quay-image-pull-secret
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              volumes:
                - name: zuul-ssh-keys
                  secret:
                    secretName: zuul-ssh-keys
                    defaultMode: 0600
                - name: zuul-home
                  emptyDir: {}
                - name: containers-storage
                  emptyDir: {}
              containers:
                - name: zuul-debian-podman
                  image: quay.io/opentelekomcloud/python-tox:latest
                  imagePullPolicy: Always
                  command: ["/bin/sh", "-c"]
                  args: ["sleep infinity"]
                  securityContext:
                    privileged: true
                  env:
                    - name: HOME
                      value: /home/zuul
                    - name: USER
                      value: zuul
                    - name: STORAGE_DRIVER
                      value: vfs
                  volumeMounts:
                    - name: zuul-ssh-keys
                      mountPath: /etc/zuul-ssh-keys
                      readOnly: true
                    - name: zuul-home
                      mountPath: /home/zuul
                    - name: containers-storage
                      mountPath: /var/lib/containers
                  resources:
                    requests:
                      cpu: "500m"
                      memory: "1Gi"
                    limits:
                      cpu: "4"
                      memory: "6Gi"
            python-path: /usr/bin/python3
            shell-type: sh
            context: prod

diskimages:
  - name: debian-bookworm
