---
# Add the SWR image pull secret to all zuul workloads.
# The secret is created in the `default` namespace by the pull-secrets Helm
# chart (kubernetes/helm_charts/local/pull-secrets) and replicated to every
# namespace (incl. `zuul`) by the kubernetes-replicator, so no local
# secretGenerator entry is needed here. Required for the SWR image overrides
# in kustomization.yaml (hardened-zuul-* and t-cloud-public/hardened-zuul-launcher).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-used
spec:
  template:
    spec:
      imagePullSecrets:
        - name: swr-secret
