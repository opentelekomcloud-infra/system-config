# JSON 6902 patch to replace zuul-var-lib volume from emptyDir to PVC
# This ensures scheduler keys persist across pod restarts for pkcs1-oaep encryption
#
# Volume indices in zuul-scheduler deployment (0-indexed):
#   0: zuul-ssh-keys
#   1: nodepool-config-yaml
#   2: ssh-config
#   3: tenant-config
#   4: zuul-config
#   5: zookeeper-client-tls
#   6: zuul-config-data
#   7: zuul-var-lib  <-- target (currently emptyDir)
#   8: zuul-var-run
#
# First remove the emptyDir from zuul-var-lib volume (index 7)
- op: remove
  path: /spec/template/spec/volumes/7/emptyDir

# Then add the persistentVolumeClaim
- op: add
  path: /spec/template/spec/volumes/7/persistentVolumeClaim
  value:
    claimName: zuul-scheduler-keys
