apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-valkey
  labels:
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/component: valkey
    spec:
      terminationGracePeriodSeconds: 10
      serviceAccountName: gitea
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: valkey
          image: valkey
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          command: ["valkey-server", "/etc/valkey/valkey.conf"]
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-valkey-secret
                  key: password
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          volumeMounts:
            - name: valkey-storage
              mountPath: /data
            - name: valkey-config
              mountPath: /etc/valkey
      volumes:
        - name: valkey-storage
          persistentVolumeClaim:
            claimName: gitea-valkey-storage-claim
        - name: valkey-config
          configMap:
            name: gitea-valkey-config
