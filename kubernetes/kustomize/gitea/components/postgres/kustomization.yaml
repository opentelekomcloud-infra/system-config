apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: postgres-vault-config
    files:
      - vault-agent.hcl

images:
  - name: postgres
    newName: "artifactory.devops.telekom.de/docker.io/library/postgres"
    newTag: "15.2-alpine"

resources:
  - deployment.yaml
  - service.yaml
  - storage.yaml
