apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-server
  labels:
    app: vllm
spec:
  serviceName: vllm-service-headless
  replicas: 2
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      imagePullSecrets:
        - name: default-secret
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: accelerator
                    operator: In
                    values:
                      - nvidia-l4
      containers:
        # - name: lmcache
        #   image: lmcache/standalone:v0.5.3
        #   command:
        #     - /opt/venv/bin/lmcache
        #     - server
        #   args:
        #     - --chunk-size
        #     - "2144"
        #     - --l1-size-gb
        #     - "70"
        #     - --host
        #     - "0.0.0.0"
        #     - --eviction-policy
        #     - LRU
        #     - --port
        #     - "6555"
        #   ports:
        #     - containerPort: 6555
        #       protocol: TCP
        #   resources:
        #     requests:
        #       cpu: "4"
        #       memory: "72Gi"
        #     limits:
        #       cpu: "8"
        #       memory: "74Gi"

        - name: vllm
          image: vllm/vllm-openai:nightly-dev-x86_64-cu13.0.1-75c2eef
          env:
            - name: VLLM_API_KEY
              value: ""
            - name: NVIDIA_VISIBLE_DEVICES
              value: "0,1"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_IMAGE_FETCH_TIMEOUT
              value: "15"
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --model
            - /models/REPLACE_ME_IN_OVERLAY
            - --served-model-name
            - replace-me-in-overlay
            - --reasoning-parser
            - qwen3
            - --tensor-parallel-size
            - "2"
            - --enable-prefix-caching
            - --gpu-memory-utilization
            - "0.90"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "8"
            - --limit-mm-per-prompt
            - '{"image":100}'
            - --max-num-batched-tokens
            - "4287"
            - --speculative-config
            - '{"method":"mtp","num_speculative_tokens":4}'
            - --override-generation-config
            - '{"temperature":0.6,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            - --kv-cache-dtype
            - fp8_e4m3
            # - --kv-transfer-config
            # - '{"kv_connector":"LMCacheMPConnector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":6555}}'
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              nvidia.com/gpu: "2"
              cpu: "20"
              memory: "90Gi"
            limits:
              nvidia.com/gpu: "2"
              cpu: "24"
              memory: "94Gi"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: false
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 60Gi
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"