apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qwen-27b-vllm
  template:
    metadata:
      labels:
        app: qwen-27b-vllm
        dedicated-model: qwen-27b
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: accelerator
                    operator: In
                    values:
                      - nvidia-l4
                  - key: dedicated-model
                    operator: In
                    values:
                      - qwen-27b
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: qwen-27b-vllm
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "dedicated-model"
          operator: "Equal"
          value: "qwen-27b"
          effect: "NoSchedule"
      containers:
        # ── LMCache: override chunk-size to match model's max-num-batched-tokens ──
        - name: lmcache
          args:
            - --chunk-size
            - "2144"
            - --separate-object-groups
            - --l1-size-gb
            - "70"
            - --eviction-policy
            - LRU
            - --port
            - "6555"

        # ── vLLM: model-specific args ──────────────────────────────────────────────
        - name: vllm
          args:
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --model
            - /models/Qwen3.8-27B-NVFP4
            - --served-model-name
            - qwen3.8-27b
            - --reasoning-parser
            - qwen3
            - --tensor-parallel-size
            - "2"
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - --enable-flashinfer-autotune
            - --gpu-memory-utilization
            - "0.92"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "8"
            - --limit-mm-per-prompt
            - '{"image":100}'
            - --max-num-batched-tokens
            - "4287"
            - --mamba-cache-mode
            - align
            - --speculative-config
            - '{"method":"mtp","num_speculative_tokens":3}'
            - --override-generation-config
            - '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
            - --default-chat-template-kwargs
            - '{"reasoning_effort": "medium"}'
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            - --kv-cache-dtype
            - fp8_e4m3
            - --kv-transfer-config
            - '{"kv_connector":"LMCacheMPConnector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":6555}}'