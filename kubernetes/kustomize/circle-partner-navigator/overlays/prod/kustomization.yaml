apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/express-mail-gateway

resources:
  - ../../base

configMapGenerator:
  - name: cpn-vault-config
    files:
      - vault-agent.hcl
  - name: cpn-front-nginx
    files:
      - cpn-front-nginx.conf

images:
  - name: "quay.io/opentelekomcloud/circle-partner-navigator-backend"
    newTag: "1.0.2"
  - name: "swr.eu-de.otc.t-systems.com/t-cloud-public/circle-partner-navigator-frontend"
    newTag: "0.6.2"

patches:
  - target:
      kind: Deployment
      name: cpn-front
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: swr-secret
