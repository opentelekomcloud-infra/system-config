# gitea jobs
- job:
    name: system-config-build-image-gitea
    description: Build a gitea hardened image with busybox included
    parent: system-config-build-image
    vars: &gitea_vars
      container_images:
        - context: docker/gitea
          registry: swr.eu-de.otc.t-systems.com
          repository: t-cloud-public/gitea
          tags: ['1.27.2-hardened-rootless']
    files: &gitea_files
      - docker/gitea/

- job:
    name: system-config-upload-image-gitea
    description: Build and upload gitea hardened image with busybox included
    parent: system-config-upload-image
    vars: *gitea_vars
    files: *gitea_files
