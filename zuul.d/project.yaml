---
- project:
    merge-mode: squash-merge
    default-branch: main
    templates:
      - publish-otc-docs-pti
    check:
      jobs:
        - otc-tox-linters
        - system-config-run-base
        - system-config-run-statsd
        - system-config-run-acme-ssl
        - system-config-run-x509-cert
        - system-config-run-apimon-epmon
        - system-config-run-apimon-scheduler
        - system-config-run-apimon-executor
        # - system-config-run-docs
        - system-config-run-graphite: &system-config-run-graphite
            dependencies:
              - name: system-config-run-memcached
                soft: true
        - system-config-run-memcached
        - system-config-run-alerta
        - system-config-run-grafana
        - system-config-run-proxy
        - system-config-run-vault
        - system-config-run-gitea
        - system-config-run-keycloak
        # - system-config-run-zookeeper
        - system-config-build-image-zookeeper-statsd
        - system-config-build-image-graphite-statsd
        - system-config-build-image-haproxy-statsd
        - system-config-build-image-zuul
        - system-config-build-image-vault
    gate:
      jobs:
        - otc-tox-linters
        - system-config-run-base
        - system-config-run-statsd
        - system-config-run-acme-ssl
        - system-config-run-x509-cert
        - system-config-run-apimon-epmon
        - system-config-run-apimon-scheduler
        - system-config-run-apimon-executor
        # - system-config-run-docs
        - system-config-run-graphite: *system-config-run-graphite
        - system-config-run-memcached
        - system-config-run-alerta
        - system-config-run-grafana
        - system-config-run-proxy
        - system-config-run-vault
        - system-config-run-gitea
        - system-config-run-keycloak
        # - system-config-run-zookeeper
        - system-config-upload-image-zookeeper-statsd
        - system-config-upload-image-graphite-statsd
        - system-config-upload-image-haproxy-statsd
        - system-config-upload-image-zuul
        - system-config-upload-image-vault
    deploy:
      jobs:
        # --- Retired legacy bridge jobs (DISABLED: unassigned from all
        # pipelines) ---
        # Each service below is now reconciled by ArgoCD on otcinfra2 or is
        # decommissioned, so the old bridge-SSH infra-prod jobs are inert and
        # have been removed from deploy/periodic/periodic-hourly. Their stub
        # job defs (zuul-infra system-config-jobs.yaml) and the playbooks
        # (system-config playbooks/*) are intentionally KEPT for history.
        #   vault                          -> ArgoCD vault-otcinfra2
        #   gitea, gitea-sync              -> ArgoCD gitea-otcinfra2 / gitea-runner-otcinfra2
        #   swift-proxy                    -> ArgoCD swift-proxy-otcinfra2
        #   zookeeper                      -> k8s zookeeper StatefulSet (zuul-otcinfra2)
        #   keycloak, configure-keycloak   -> zitadel-otcinfra2 (decommissioned)
        #   acme-ssl                       -> ArgoCD cert-manager-*
        #   apimon-{epmon,executor,k8s,scheduler} -> fleet decommissioned (down)
        #   bootstrap-bridge, base, base-ext, service-bridge -> bridge retired
        #   install-cce, install-loadbalancer, grafana-dashboards -> no playbook
        #
        # Legacy bridge jobs NOT yet migrated/verified are kept below as
        # in-pipeline placeholders (soft-deps on the now-absent infra-prod-base
        # are ignored). Migrate to the bridge-less runner or confirm-dead
        # before removing.
        - infra-prod-grafana-datasources: &infra-prod-grafana-datasources
            dependencies:
              - name: infra-prod-bootstrap-bridge
                soft: true

        - infra-prod-service-opensearch: &infra-prod-service-opensearch
            dependencies:
              - name: infra-prod-base
                soft: true

        - infra-prod-install-helm-chart: &infra-prod-install-helm-chart
            dependencies:
              - name: infra-prod-base
                soft: true

        - infra-prod-service-alerta: &infra-prod-service-alerta
            dependencies:
              - name: infra-prod-base
                soft: true

        - infra-prod-service-grafana: &infra-prod-service-grafana
            dependencies:
              - name: infra-prod-base
                soft: true

        - infra-prod-service-memcached: &infra-prod-service-memcached
            dependencies:
              - name: infra-prod-base
                soft: true

        - infra-prod-service-octavia-proxy: &infra-prod-service-octavia-proxy
            dependencies:
              - name: infra-prod-base
                soft: true

        - infra-prod-service-statsd: &infra-prod-service-statsd
            dependencies:
              - name: infra-prod-base
                soft: true

        - infra-prod-service-proxy: &infra-prod-service-proxy
            dependencies:
              - name: infra-prod-base
                soft: true

        # Bridge-less ephemeral-node deploys (infra-prod-playbook-k8s
        # runner, zuul-infra). Standalone: no bridge/base dependency.
        # Services migrated off the retired bastion.
        - infra-prod-cloud-dns
        - infra-prod-service-cloudmon
        - infra-prod-service-graphite

    periodic:
      # Nightly execution
      jobs:
        # Legacy bridge jobs not yet migrated — kept as placeholders
        # (see the deploy pipeline above for the retired/disabled list).
        - infra-prod-service-opensearch: *infra-prod-service-opensearch
        - infra-prod-install-helm-chart: *infra-prod-install-helm-chart
        - infra-prod-grafana-datasources: *infra-prod-grafana-datasources
        - infra-prod-service-alerta: *infra-prod-service-alerta
        - infra-prod-service-grafana: *infra-prod-service-grafana
        - infra-prod-service-memcached: *infra-prod-service-memcached
        - infra-prod-service-statsd: *infra-prod-service-statsd
        - infra-prod-service-proxy: *infra-prod-service-proxy

        # Bridge-less ephemeral-node deploys (nightly drift correction).
        - infra-prod-cloud-dns
        - infra-prod-service-cloudmon
        - infra-prod-service-graphite
